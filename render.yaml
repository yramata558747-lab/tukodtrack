# Paid web service + paid MySQL service and disk. Review Render's estimate before deploying.
services:
  - type: pserv
    name: tukodtrack-mysql
    runtime: image
    image:
      url: docker.io/library/mysql:8.4
    plan: starter
    region: singapore
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 1
    envVars:
      - key: MYSQL_DATABASE
        value: tukodtrack
      - key: MYSQL_USER
        value: tukodtrack
      - key: MYSQL_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true
  - type: web
    name: tukodtrack
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: TukodTrack
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: INITIAL_OWNER_NAME
        sync: false
      - key: INITIAL_OWNER_EMAIL
        sync: false
      - key: INITIAL_OWNER_PASSWORD
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromService:
          type: pserv
          name: tukodtrack-mysql
          property: host
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        value: tukodtrack
      - key: DB_USERNAME
        value: tukodtrack
      - key: DB_PASSWORD
        fromService:
          type: pserv
          name: tukodtrack-mysql
          envVarKey: MYSQL_PASSWORD
